<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080604" />
    <title>Dungeon 64</title>
    <link rel="stylesheet" href="./ui.css" />
  </head>
  <body>
    <main>
      <div class="titlebar">
        <strong>Dungeon 64</strong>
        <div class="title-actions">
          <button id="resolution" type="button" title="Change internal resolution">64×64</button>
          <span><span id="position">S · 1,1</span> · GI ×5</span>
        </div>
      </div>
      <div class="frame">
        <canvas id="app" width="64" height="64" aria-label="Dungeon crawler ray traced"></canvas>
        <canvas id="impostors" width="64" height="64" aria-hidden="true"></canvas>
        <div class="crosshair" aria-hidden="true"></div>
        <div id="interaction-hint" hidden></div>
        <div id="combat-log" aria-live="polite"></div>
        <div id="message">Find the treasure</div>
        <aside id="inventory" aria-label="Inventory" hidden>
          <div class="inventory-header">
            <h2>Inventory</h2>
            <span id="inventory-capacity">0/8</span>
          </div>
          <div id="inventory-stats"></div>
          <div id="inventory-items" role="list"></div>
          <div id="inventory-tooltip" role="status" hidden>
            <div id="inventory-tooltip-name"></div>
            <div id="inventory-tooltip-stats"></div>
            <div id="inventory-tooltip-description"></div>
          </div>
          <p class="inventory-help">Hover or focus an icon · 1–8 use · I/Esc close</p>
        </aside>
      </div>
      <div class="statusbar">
        <span id="health">HP 100</span>
        <span id="samples">0 spp</span>
      </div>
    </main>
    <div class="help">
      Drag look · Click interact · Wheel zoom · W/S move · A/D turn · Q/E strafe · I inventory
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
