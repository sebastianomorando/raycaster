<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080604" />
    <title>Dungeon 64</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        background: #070504;
        color: #d6c5a5;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-content: center;
        background:
          radial-gradient(circle at 50% 38%, #28170d 0, #0b0705 43%, #030201 100%);
      }

      main { display: grid; gap: 10px; }

      .titlebar,
      .statusbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 20px;
        padding: 0 2px;
        color: #806a4d;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .titlebar strong {
        color: #d99b45;
        font-size: 12px;
        letter-spacing: 0.16em;
      }

      .title-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      #resolution {
        min-width: 58px;
        padding: 3px 6px;
        border: 1px solid #67462b;
        border-radius: 0;
        background: #160e09;
        color: #d99b45;
        font: inherit;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        cursor: pointer;
      }

      #resolution:hover,
      #resolution:focus-visible {
        border-color: #b67a3a;
        background: #28170d;
        outline: none;
      }

      #resolution:disabled {
        color: #594936;
        cursor: wait;
      }

      .frame {
        position: relative;
        border: 1px solid #67462b;
        background: #000;
        box-shadow: 0 22px 90px #000, 0 0 0 4px #160e09;
        cursor: grab;
        touch-action: none;
      }

      .frame.looking { cursor: grabbing; }

      canvas {
        display: block;
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .crosshair {
        position: absolute;
        inset: 50% auto auto 50%;
        width: 5px;
        height: 5px;
        translate: -50% -50%;
        opacity: 0.5;
        pointer-events: none;
      }

      .crosshair::before,
      .crosshair::after {
        position: absolute;
        content: "";
        background: #f5d79b;
      }

      .crosshair::before { top: 2px; left: 0; width: 5px; height: 1px; }
      .crosshair::after { top: 0; left: 2px; width: 1px; height: 5px; }

      #message {
        position: absolute;
        left: 50%;
        bottom: 5%;
        translate: -50% 0;
        width: max-content;
        max-width: 88%;
        padding: 3px 5px;
        background: #090603c7;
        color: #d6c5a5;
        font-size: 9px;
        text-align: center;
        text-transform: uppercase;
        pointer-events: none;
      }

      #message.won { color: #ffc35b; }
      #health { color: #b85b46; }
      #samples { color: #a97839; }

      .help {
        position: fixed;
        right: 12px;
        bottom: 10px;
        max-width: calc(100vw - 24px);
        color: #594936;
        font-size: 9px;
        line-height: 1.5;
        text-align: right;
        text-transform: uppercase;
      }

      @media (max-height: 620px) {
        .help { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="titlebar">
        <strong>Dungeon 64</strong>
        <div class="title-actions">
          <button id="resolution" type="button" title="Cambia risoluzione interna">64×64</button>
          <span><span id="position">S · 1,1</span> · GI ×5</span>
        </div>
      </div>
      <div class="frame">
        <canvas id="app" width="64" height="64" aria-label="Dungeon crawler ray traced"></canvas>
        <div class="crosshair" aria-hidden="true"></div>
        <div id="message">Trova il baule</div>
      </div>
      <div class="statusbar">
        <span id="health">Vita 100</span>
        <span id="samples">0 spp</span>
      </div>
    </main>
    <div class="help">
      Trascina per guardarti intorno · Rotellina zoom · W/S muovi · A/D gira 90° · Q/E strafing · R ricomincia
    </div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
