<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080a10" />
    <title>64² Ray Tracer</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: ui-monospace, "SFMono-Regular", Consolas, monospace;
        background: #080a10;
        color: #cbd5e1;
      }

      * { box-sizing: border-box; }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        display: grid;
        place-content: center;
        gap: 12px;
        background:
          radial-gradient(circle at 50% 35%, #182032 0, #080a10 50%, #030407 100%);
      }

      .frame {
        position: relative;
        border: 1px solid #334155;
        background: #000;
        box-shadow: 0 24px 80px #000b, 0 0 0 4px #0f172a;
        cursor: crosshair;
      }

      canvas {
        display: block;
        width: 64px;
        height: 64px;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }

      .bar {
        display: flex;
        justify-content: space-between;
        gap: 24px;
        padding: 0 2px;
        color: #64748b;
        font-size: 11px;
        letter-spacing: 0.04em;
        text-transform: uppercase;
      }

      #samples { color: #f59e0b; }

      .help {
        position: fixed;
        right: 14px;
        bottom: 12px;
        max-width: calc(100vw - 28px);
        color: #475569;
        font-size: 10px;
        text-align: right;
      }

      @media (max-height: 540px) {
        .help { display: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="frame" title="Clicca per controllare la visuale">
        <canvas id="app" width="64" height="64" aria-label="Ray tracer progressivo 64 per 64 pixel"></canvas>
      </div>
      <div class="bar">
        <span>CPU ray tracer · 64²</span>
        <span id="samples">0 spp</span>
      </div>
    </main>
    <div class="help">WASD muovi · Q/E quota · frecce o mouse guarda · spazio pausa · R reset</div>
    <script type="module" src="./index.ts"></script>
  </body>
</html>
